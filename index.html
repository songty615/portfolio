:root{

}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));

.bar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:46px;flex-wrap:wrap;padding-block:2px}
.brand{font-weight:700;letter-spacing:.01em;color:var(--accent);margin-right:auto;font-size:15px}
.brand span{color:var(--muted);font-weight:500;margin-left:8px}

nav>button,.dd>button{position:relative}
.dd{position:relative}
.dm{position:absolute;left:0;top:100%;min-width:max-content;display:flex;flex-direction:column;background:var(--bar);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 10px 26px rgba(40,10,20,.16);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .18s,transform .18s,visibility 0s .18s}
.dd:hover .dm,.dd:focus-within .dm{opacity:1;visibility:visible;transform:none;transition:opacity .18s,transform .18s}
.dm button{text-align:left;white-space:nowrap;font-weight:500}
nav .dm button[aria-current]{box-shadow:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:48px;text-align:right}
main{max-width:1280px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
.slide{margin:0;scroll-margin-top:0}
.slide img{display:block;width:100%;height:auto;aspect-ratio:16/9;background:var(--line)}
footer{max-width:1280px;margin:0 auto;padding-block:0 32px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:560px){.brand span{display:none}main{gap:12px;padding-top:12px}}
